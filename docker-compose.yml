services:
  postgres:
    image: postgres:16-alpine
    container_name: navigatr-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: navigatr
      POSTGRES_PASSWORD: navigatr-dev
      POSTGRES_DB: navigatr
    volumes:
      - navigatr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navigatr -d navigatr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  navigatr-postgres-data:
