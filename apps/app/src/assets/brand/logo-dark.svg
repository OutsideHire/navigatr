<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;display=swap');
    </style>
  </defs>

  <rect width="1600" height="500" fill="#0A1733"/>

  <!-- Compass icon -->
  <g transform="translate(250, 250)">
    <circle cx="0" cy="0" r="200" fill="none" stroke="#FFFFFF" stroke-width="28"/>
    <polygon points="0,-160 -55,30 55,30" fill="#2456E6"/>
    <polygon points="0,160 -55,-30 55,-30" fill="#FFFFFF"/>
    <polygon points="0,-60 65,0 0,60 -65,0" fill="#0A1733" stroke="#2456E6" stroke-width="6"/>
    <circle cx="0" cy="0" r="18" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="540" y="345"
        font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif"
        font-weight="600"
        font-size="260"
        letter-spacing="-10"
        fill="#FFFFFF">navigatr</text>
</svg>
